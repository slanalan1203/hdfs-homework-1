name: hdfs-homework

x-hdfs: &hdfs
  image: hdfs-homework:3.4.3
  build: .
  init: false
  restart: unless-stopped
  stop_grace_period: 30s
  mem_limit: 1g
  networks: [hdfs]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-datanode: &datanode
  <<: *hdfs
  command: [datanode]
  depends_on:
    namenode:
      condition: service_healthy
  healthcheck:
    test: [CMD, curl, -fsS, --max-time, "5", http://localhost:9864/]
    interval: 10s
    timeout: 6s
    retries: 18
    start_period: 20s

services:
  namenode:
    <<: *hdfs
    hostname: namenode
    command: [namenode]
    ports: ["127.0.0.1:9870:9870"]
    volumes: [namenode:/data]
    healthcheck:
      test: [CMD, curl, -fsS, --max-time, "5", http://localhost:9870/]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 20s
  secondarynamenode:
    <<: *hdfs
    hostname: secondarynamenode
    command: [secondarynamenode]
    ports: ["127.0.0.1:9868:9868"]
    volumes: [secondarynamenode:/data]
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, --max-time, "5", http://localhost:9868/]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 20s
  datanode1:
    <<: *datanode
    hostname: datanode1
    volumes: [datanode1:/data]
  datanode2:
    <<: *datanode
    hostname: datanode2
    volumes: [datanode2:/data]
  datanode3:
    <<: *datanode
    hostname: datanode3
    volumes: [datanode3:/data]

networks:
  hdfs:
    driver: bridge
volumes:
  namenode:
  secondarynamenode:
  datanode1:
  datanode2:
  datanode3:
