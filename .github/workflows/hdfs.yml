name: HDFS integration
on: [push, pull_request, workflow_dispatch]
jobs:
  hdfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check health validator
        run: python3 -m unittest discover -s tests -v
      - name: Deploy, verify and test persistence
        run: bash tests/integration.sh
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/cluster.log 2>&1
          docker compose ps -a > reports/containers.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdfs-reports
          path: reports/
      - name: Stop cluster
        if: always()
        run: docker compose down
